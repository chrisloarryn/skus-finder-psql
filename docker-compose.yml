services:
  products-api:
    build:
      context: .
      args:
        port: 8088
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      ENVIRONMENT: PRODUCTION
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DB_NAME: postgres
    #      ENVIRONMENT: DEVELOPMENT
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    container_name: products-sku-api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - some-net
  postgres:
    build:
      context: ./sql
    image: skus-finder-psql-postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "65432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - some-net
    container_name: products-sku-api-db
networks:
  some-net:
    driver: bridge
